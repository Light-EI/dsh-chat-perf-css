name: release-zip

# 发版时自动打包 zip 附件，消灭「zip 与 tag 内容不一致」这类手滑。
# 手动触发（dry_run=true）只打包不上传，用来验证流程本身。

on:
  release:
    types: [published]
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: 要打包的 tag（例如 v1.0.0）
        required: true
      dry_run:
        description: 只打包，不上传
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    permissions:
      contents: write # 只有上传资产需要写权限
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag || github.ref }}

      - name: 校验文件齐全、语法可解析、版本号对得上 tag
        env:
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
          EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail

          # 1. 出厂文件必须一个不少（有人改名/删文件时立刻失败，而不是发个残缺的 zip）
          for f in package.json index.js client.js cordis.patch.yml icon.svg README.md LICENSE locale/en.json locale/zh.json; do
            test -f "$f" || { echo "缺少文件: $f"; exit 1; }
          done

          # 2. 语法检查
          node --check index.js
          node --check client.js
          node -e 'const fs=require("node:fs");["package.json","locale/en.json","locale/zh.json"].forEach((f)=>JSON.parse(fs.readFileSync(f,"utf8")));console.log("JSON ok")'
          test -s cordis.patch.yml || { echo "cordis.patch.yml 是空的"; exit 1; }

          # 3. 版本号必须和 tag 一致（只在发版时校验，手动触发时 tag 由输入决定）
          if [ "$EVENT" = "release" ]; then
            VERSION=$(node -e 'process.stdout.write(JSON.parse(require("node:fs").readFileSync("package.json","utf8")).version)')
            [ "v$VERSION" = "$TAG" ] || { echo "tag $TAG 与 package.json 的 v$VERSION 不一致"; exit 1; }
            echo "版本一致: $TAG"
          fi

      - name: 打包 zip
        # 只有发版和手动触发才打包；push / PR 只做上面的静态校验（都没有 tag 可打）
        if: ${{ github.event_name == 'release' || github.event_name == 'workflow_dispatch' }}
        env:
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          set -euo pipefail
          STAGE="out/dsh-chat-perf-css"
          mkdir -p "$STAGE/locale"
          cp package.json index.js client.js cordis.patch.yml icon.svg README.md LICENSE "$STAGE/"
          cp locale/en.json locale/zh.json "$STAGE/locale/"

          # 统一所有文件的 mtime（zip 会把它写进条目里），再用 -X 去掉额外的权限/宿主属性，
          # 这样同一个 tag 重打包产出的 zip 是字节一致的，sha256 不会因为打包时刻变化。
          # 注意：Touch 用 UTC，runner 也是 UTC，所以结果跟机器时区无关。
          find "$STAGE" -exec touch -t 198001010000.00 {} +
          (cd out && TZ=UTC zip -X -r "../dsh-chat-perf-css-${TAG}.zip" dsh-chat-perf-css)

          # 校验和一起发，用户拿到 zip 可以自己核对
          sha256sum "dsh-chat-perf-css-${TAG}.zip" > "dsh-chat-perf-css-${TAG}.zip.sha256"

          ls -l "dsh-chat-perf-css-${TAG}.zip" "dsh-chat-perf-css-${TAG}.zip.sha256"
          unzip -l "dsh-chat-perf-css-${TAG}.zip"
          cat "dsh-chat-perf-css-${TAG}.zip.sha256"

      - name: 上传到 Release
        # 注意：不能写 `inputs.dry_run == false` —— 非 dispatch 事件里 inputs 是 null，
        # GitHub 表达式会把 null 和 false 都按 0 比较，结果是 true（push 也会去上传）。
        if: ${{ github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && inputs.dry_run == false) }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: >-
          gh release upload "$TAG"
          "dsh-chat-perf-css-${TAG}.zip"
          "dsh-chat-perf-css-${TAG}.zip.sha256"
          --clobber
